name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: indodax_quant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d indodax_quant_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Verify Supabase security and index migrations on PostgreSQL 17
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d indodax_quant_test -v ON_ERROR_STOP=1 -f tests/sql/is_app_user_security_setup.sql
          psql -h localhost -U postgres -d indodax_quant_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261114170008_is_app_user_security_invoker.sql
          psql -h localhost -U postgres -d indodax_quant_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261114170619_improve_paper_trade_fk_indexes.sql
          psql -h localhost -U postgres -d indodax_quant_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261114171017_optimize_app_users_self_rls_initplan.sql
          psql -h localhost -U postgres -d indodax_quant_test -v ON_ERROR_STOP=1 -f tests/sql/is_app_user_security_assert.sql
          psql -h localhost -U postgres -d indodax_quant_test -v ON_ERROR_STOP=1 -f tests/sql/mtf_source_precedence_test.sql
          psql -h localhost -U postgres -d indodax_quant_test -v ON_ERROR_STOP=1 -f tests/sql/run_watchdog_test.sql
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Deploy Supabase Edge Function (INDODAX read-only relay)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN not set - skipping indodax-proxy deploy (INDODAX blocks Cloudflare Workers, market data needs this relay)."
          else
            npx -y supabase@2 functions deploy indodax-proxy --project-ref znikuooxiqfcicyuhqsx --no-verify-jwt --use-api
            sleep 3
            curl -fsS "https://znikuooxiqfcicyuhqsx.supabase.co/functions/v1/indodax-proxy?path=%2Fapi%2Fticker%2Fbtcidr" | tee relay.json
            grep -q '"last"' relay.json
          fi
      - name: Check Cloudflare secrets
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set - skipping deploy. See README > Cloudflare deployment."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.skip != 'true'
        run: npm install --no-audit --no-fund && npm run build
      - name: Deploy Worker + static assets + cron trigger
        if: steps.check.outputs.skip != 'true'
        id: deploy
        run: |
          npx wrangler deploy 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "::notice title=Deployed URL::$URL"
      - name: Sync Worker secrets
        if: steps.check.outputs.skip != 'true'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          for NAME in SUPABASE_SERVICE_ROLE_KEY TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do
            VALUE="${!NAME}"
            if [ -n "$VALUE" ]; then
              printf '%s' "$VALUE" | npx wrangler secret put "$NAME" >/dev/null && echo "synced $NAME"
            else
              echo "::warning::$NAME not set in GitHub secrets"
            fi
          done
      - name: Smoke test
        if: steps.check.outputs.skip != 'true' && steps.deploy.outputs.url != ''
        run: |
          sleep 10
          curl -fsS "${{ steps.deploy.outputs.url }}/api/health" | tee health.json
          grep -q '"liveTrading":false' health.json
          curl -fsS -o /dev/null "${{ steps.deploy.outputs.url }}/"
          echo "Deployed: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"

  strategy-evaluation:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://znikuooxiqfcicyuhqsx.supabase.co
      BACKTEST_HISTORY_DAYS: 30
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Verify the read-only evaluation credential is available
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY is required for historical evaluation."
            exit 1
          fi
      - name: Run controlled crossLookback 2 vs 4 backtest
        run: |
          mkdir -p artifacts
          ./node_modules/.bin/tsx scripts/backtest.ts > artifacts/backtest.json 2> artifacts/backtest-stderr.log
      - name: Generate read-only paper account report
        run: ./node_modules/.bin/tsx scripts/paper-report.ts 1 > artifacts/paper-report.json
      - name: Write evaluation summary
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const backtest = JSON.parse(fs.readFileSync('artifacts/backtest.json', 'utf8'));
          const paper = JSON.parse(fs.readFileSync('artifacts/paper-report.json', 'utf8'));
          const lines = [
            '## Strategy evaluation (read-only)',
            '',
            '- Control: crossLookback=2.',
            '- Variant: crossLookback=4 (only changed parameter).',
            '- Holdout: chronological final 30% per pair.',
            '- No order or paper-account mutation is performed by either script.',
            '',
            '### Aggregated holdout (independent per-pair accounts, not a shared portfolio)',
            '',
            '| Variant | Trades | Win rate | Profit factor | Net PnL | Expectancy | Max drawdown | End-of-data exits |',
            '|---|---:|---:|---:|---:|---:|---:|---:|',
            ...Object.entries(backtest.aggregateOutOfSampleIndependentPairAccounts || {}).map(([key, m]) =>
              '|' + key + '|' + String(m.trades || 0) + '|' + String(m.winRatePct || 0) + '%|' + String(m.profitFactor ?? 'n/a') + '|Rp ' + Number(m.netPnlIdr || 0).toLocaleString('id-ID') + '|Rp ' + Number(m.expectancyIdr || 0).toLocaleString('id-ID') + '|' + String(m.maxDrawdownPct || 0) + '%|' + String(m.endOfDataExits || 0) + '|'
            ),
            '',
            '### Evidence gate (never auto-promotes a strategy)',
            '',
            '| Variant | Decision | Wilson 95% win-rate lower bound | Rejection reasons |',
            '|---|---|---:|---|',
            ...Object.entries(backtest.evidenceGateByVariant || {}).map(([key, decision]) =>
              '|' + key + '|' + String(decision.status || 'NO_GO') + '|' + String(decision.lower95WinRatePct || 0) + '%|' + (decision.reasons || []).join(', ') + '|'
            ),
            '',
            '| Pair | Bars | Official OHLC coverage | Holdout starts | 2: trades / win rate / PF / net PnL | 4: trades / win rate / PF / net PnL |',
            '|---|---:|---:|---|---:|---:|',
          ];
          for (const [pair, result] of Object.entries(backtest.results || {})) {
            const two = (result.variants || {}).cross_lookback_2?.outOfSampleLast30Pct || {};
            const four = (result.variants || {}).cross_lookback_4?.outOfSampleLast30Pct || {};
            const fmt = (m) => String(m.trades || 0) + ' / ' + String(m.winRatePct || 0) + '% / ' + String(m.profitFactor ?? 'n/a') + ' / Rp ' + Number(m.netPnlIdr || 0).toLocaleString('id-ID');
            const history = result.officialHistory || {};
            const coverage = history.historyCoveragePct == null ? 'n/a' : String(history.historyCoveragePct) + '% (' + String(history.complete5mBars || 0) + '/' + String(history.expected5mBars || 0) + ')';
            lines.push('|' + pair + '|' + result.candles + '|' + coverage + '|' + result.holdoutFrom + '|' + fmt(two) + '|' + fmt(four) + '|');
          }
          lines.push(
            '',
            'Pairs evaluated: **' + String((backtest.experiment || {}).pairsEvaluated || 0) + '** of ' + String((backtest.experiment || {}).pairsRequested || 0) + ' requested.',
            'Official history window: **' + String((backtest.experiment || {}).officialHistoryDaysRequested || 0) + ' days**; complete OHLC 5m bars: **' + String((backtest.experiment || {}).officialHistoryComplete5mBars || 0) + '/' + String((backtest.experiment || {}).officialHistoryExpected5mBars || 0) + '** (**' + String((backtest.experiment || {}).officialHistoryCoveragePct || 0) + '% structural coverage**).',
            'Positive-volume 5m bars: **' + String((backtest.experiment || {}).officialHistoryActiveVolume5mBars || 0) + '** (**' + String((backtest.experiment || {}).officialHistoryActiveVolumeCoveragePct || 0) + '% of expected bars**); zero-volume 5m bars: **' + String((backtest.experiment || {}).officialHistoryZeroVolume5mBars || 0) + '**; zero-volume 1m bars: **' + String((backtest.experiment || {}).officialHistoryZeroVolume1mBars || 0) + '**.'
            '',
            '### Paper account since reset',
            '',
            '- Status: **' + String((paper.account || {}).status || 'unknown') + '**',
            '- Equity: Rp ' + Number((paper.account || {}).equityIdr || 0).toLocaleString('id-ID'),
            '- Closed trades: **' + String((paper.paperPerformanceSinceReset || {}).closedTrades || 0) + '**',
            '- Open positions: **' + String((paper.paperPerformanceSinceReset || {}).openPositions || 0) + '**',
            '- Realized PnL: Rp ' + Number((paper.paperPerformanceSinceReset || {}).netPnlIdr || 0).toLocaleString('id-ID'),
            '',
            '### Backtest scope limitations',
            '',
            ...((backtest.scopeWarnings || []).map((warning) => '- ' + warning)),
            '- Unclosed positions are closed at the final observed candle close with exit slippage and fee; see END_OF_DATA exits in the JSON.',
            '- Aggregated holdout figures combine independent per-pair accounts; they are not a shared-cash portfolio.',
            '- Candle-only per-pair simulation; not production-parity for portfolio-level cash/exposure or MTF execution.',
            '',
            'Full JSON outputs are attached as the strategy-evaluation artifact.',
          );
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: strategy-evaluation
          path: artifacts/
          retention-days: 30
