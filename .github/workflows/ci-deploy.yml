name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: indodax_quant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d indodax_quant_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Verify Supabase security and index migrations on PostgreSQL 17
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d indodax_quant_test -v ON_ERROR_STOP=1 -f tests/sql/is_app_user_security_setup.sql
          psql -h localhost -U postgres -d indodax_quant_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261114170008_is_app_user_security_invoker.sql
          psql -h localhost -U postgres -d indodax_quant_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261114170619_improve_paper_trade_fk_indexes.sql
          psql -h localhost -U postgres -d indodax_quant_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261114171017_optimize_app_users_self_rls_initplan.sql
          psql -h localhost -U postgres -d indodax_quant_test -v ON_ERROR_STOP=1 -f tests/sql/is_app_user_security_assert.sql
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Deploy Supabase Edge Function (INDODAX read-only relay)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN not set - skipping indodax-proxy deploy (INDODAX blocks Cloudflare Workers, market data needs this relay)."
          else
            npx -y supabase@2 functions deploy indodax-proxy --project-ref znikuooxiqfcicyuhqsx --no-verify-jwt --use-api
            sleep 3
            curl -fsS "https://znikuooxiqfcicyuhqsx.supabase.co/functions/v1/indodax-proxy?path=%2Fapi%2Fticker%2Fbtcidr" | tee relay.json
            grep -q '"last"' relay.json
          fi
      - name: Check Cloudflare secrets
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set - skipping deploy. See README > Cloudflare deployment."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.skip != 'true'
        run: npm install --no-audit --no-fund && npm run build
      - name: Deploy Worker + static assets + cron trigger
        if: steps.check.outputs.skip != 'true'
        id: deploy
        run: |
          npx wrangler deploy 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "::notice title=Deployed URL::$URL"
      - name: Sync Worker secrets
        if: steps.check.outputs.skip != 'true'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          for NAME in SUPABASE_SERVICE_ROLE_KEY TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do
            VALUE="${!NAME}"
            if [ -n "$VALUE" ]; then
              printf '%s' "$VALUE" | npx wrangler secret put "$NAME" >/dev/null && echo "synced $NAME"
            else
              echo "::warning::$NAME not set in GitHub secrets"
            fi
          done
      - name: Smoke test
        if: steps.check.outputs.skip != 'true' && steps.deploy.outputs.url != ''
        run: |
          sleep 10
          curl -fsS "${{ steps.deploy.outputs.url }}/api/health" | tee health.json
          grep -q '"liveTrading":false' health.json
          curl -fsS -o /dev/null "${{ steps.deploy.outputs.url }}/"
          echo "Deployed: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
