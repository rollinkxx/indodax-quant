name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.detect.outputs.deploy }}
      relay: ${{ steps.detect.outputs.relay }}
      migrate: ${{ steps.detect.outputs.migrate }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        name: Classify changed files for release
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/detect-ci-changes.mjs

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: indodax_quant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d indodax_quant_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - name: Verify Supabase security and index migrations on PostgreSQL 17
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d indodax_quant_test -v ON_ERROR_STOP=1 -f tests/sql/is_app_user_security_setup.sql
          psql -h localhost -U postgres -d indodax_quant_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261114170008_is_app_user_security_invoker.sql
          psql -h localhost -U postgres -d indodax_quant_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261114170619_improve_paper_trade_fk_indexes.sql
          psql -h localhost -U postgres -d indodax_quant_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261114171017_optimize_app_users_self_rls_initplan.sql
          psql -h localhost -U postgres -d indodax_quant_test -v ON_ERROR_STOP=1 -f tests/sql/is_app_user_security_assert.sql
          psql -h localhost -U postgres -d indodax_quant_test -v ON_ERROR_STOP=1 -f tests/sql/mtf_source_precedence_test.sql
          psql -h localhost -U postgres -d indodax_quant_test -v ON_ERROR_STOP=1 -f tests/sql/run_watchdog_test.sql
      - name: Replay the complete Supabase migration chain on a clean PostgreSQL 17 database
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h localhost -U postgres indodax_quant_migration_test
          psql -h localhost -U postgres -d indodax_quant_migration_test -v ON_ERROR_STOP=1 -f tests/sql/migrations-clean-bootstrap.sql
          for migration in supabase/migrations/*.sql; do
            echo "Applying $migration"
            psql -h localhost -U postgres -d indodax_quant_migration_test -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql -h localhost -U postgres -d indodax_quant_migration_test -v ON_ERROR_STOP=1 -f tests/sql/migrations-clean-assert.sql
          psql -h localhost -U postgres -d indodax_quant_migration_test -v ON_ERROR_STOP=1 -f tests/sql/pipeline_lease_fencing_test.sql
          psql -h localhost -U postgres -d indodax_quant_migration_test -v ON_ERROR_STOP=1 -f tests/sql/universe_history_test.sql
          psql -h localhost -U postgres -d indodax_quant_migration_test -v ON_ERROR_STOP=1 -f tests/sql/get_recent_candles_empty_array_test.sql
          psql -h localhost -U postgres -d indodax_quant_migration_test -v ON_ERROR_STOP=1 -f tests/sql/pipeline_phase_test.sql
          psql -h localhost -U postgres -d indodax_quant_migration_test -v ON_ERROR_STOP=1 -f tests/sql/pending_entries_test.sql
          psql -h localhost -U postgres -d indodax_quant_migration_test -v ON_ERROR_STOP=1 -f tests/sql/wib_day_boundary_test.sql
          psql -h localhost -U postgres -d indodax_quant_migration_test -v ON_ERROR_STOP=1 -f tests/sql/paper_mark_idempotency_test.sql
          psql -h localhost -U postgres -d indodax_quant_migration_test -v ON_ERROR_STOP=1 -f tests/sql/universe_removed_position_test.sql
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist-and-lock
          path: |
            dist/
            package-lock.json

  # Apply pending Supabase migrations to production BEFORE deploying code that may depend on them.
  # This closes the drift class where a Worker change shipped ahead of its migration and failed at runtime
  # with a PostgREST 404 that the per-minute cron silently absorbed (the pending-SELL regression).
  migrate:
    needs: [test, detect-changes]
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      needs.test.result == 'success' &&
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.migrate == 'true'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: znikuooxiqfcicyuhqsx
      SUPABASE_URL: https://znikuooxiqfcicyuhqsx.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - name: Require migration credentials
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::SUPABASE_ACCESS_TOKEN is required to apply migrations."; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "::error::SUPABASE_SERVICE_ROLE_KEY is required to verify the schema."; exit 1; }
      - name: Apply pending Supabase migrations
        run: npx tsx scripts/apply-migrations.ts
      - name: Verify the live schema exposes every RPC and table the Worker requires
        run: npx tsx scripts/verify-schema-contract.ts
      - name: Verify the live begin_run returns every key the Worker reads
        # A replacement body can keep the name and signature while dropping keys from its jsonb, which
        # crashes the Worker before it inserts a run row: no error, no cron. Existence checks miss it.
        run: npx tsx scripts/verify-begin-run.ts

  # Every Worker deployment refreshes the signing secret; sync and deploy the Supabase relay afterwards.
  # Pipeline ingestion is smoke-tested in deploy-relay, only after both sides share the same HMAC secret.
  deploy-relay:
    needs: [test, detect-changes, migrate, deploy]
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      needs.test.result == 'success' &&
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.relay == 'true' &&
      (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') &&
      (needs.deploy.result == 'success' || needs.deploy.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: https://znikuooxiqfcicyuhqsx.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      WORKER_URL: ${{ needs.deploy.outputs.url || 'https://indodax-quant.sinyalku.workers.dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - name: Require relay deployment credentials
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::SUPABASE_ACCESS_TOKEN is required when the relay changes."; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "::error::SUPABASE_SERVICE_ROLE_KEY is required for relay verification."; exit 1; }
      - name: Configure explicit relay HMAC secret in Supabase
        run: |
          umask 077
          SECRET_FILE="$(mktemp)"
          trap 'rm -f "$SECRET_FILE"' EXIT
          printf '%s\n' "INDODAX_RELAY_HMAC_SECRET=$SUPABASE_SERVICE_ROLE_KEY" > "$SECRET_FILE"
          npx -y supabase@2 secrets set --env-file "$SECRET_FILE" --project-ref znikuooxiqfcicyuhqsx
      - name: Deploy authenticated INDODAX relay
        run: |
          npx -y supabase@2 functions deploy indodax-proxy --project-ref znikuooxiqfcicyuhqsx --no-verify-jwt --use-api
      - name: Verify unsigned requests are blocked and HMAC requests work
        id: verify-relay
        run: |
          npx tsx scripts/smoke-relay.ts
          echo "verified_at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Verify Worker ingests through the HMAC-enforced relay
        env:
          MIN_PIPELINE_START_AT: ${{ steps.verify-relay.outputs.verified_at }}
        run: npx tsx scripts/smoke-production.ts

  # Deploy the Worker first, then synchronize and verify relay HMAC before testing pipeline ingestion.
  deploy:
    outputs:
      url: ${{ steps.deploy.outputs.url }}
      deployed_at: ${{ steps.deploy.outputs.deployed_at }}
    needs: [test, detect-changes, migrate]
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      needs.test.result == 'success' &&
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.deploy == 'true' &&
      (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require production deployment credentials
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is required for a Worker deployment."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is required for a Worker deployment."; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "::error::SUPABASE_SERVICE_ROLE_KEY is required for a Worker deployment."; exit 1; }
      - run: npm ci --no-audit --no-fund && npm run build
      - name: Deploy Worker + static assets + cron trigger
        id: deploy
        run: |
          npx wrangler deploy 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          test -n "$URL" || { echo "::error::Unable to identify deployed Worker URL."; exit 1; }
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "deployed_at=$(date +%s)" >> "$GITHUB_OUTPUT"
          echo "::notice title=Deployed URL::$URL"
      - name: Sync required and optional Worker secrets
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
        run: |
          printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY >/dev/null
          echo "synced SUPABASE_SERVICE_ROLE_KEY"
          for NAME in TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID POSTHOG_PROJECT_TOKEN; do
            VALUE="${!NAME}"
            if [ -n "$VALUE" ]; then
              printf '%s' "$VALUE" | npx wrangler secret put "$NAME" >/dev/null && echo "synced $NAME"
            else
              echo "::notice::$NAME is optional and not configured."
            fi
          done
      - name: Smoke test Worker paper-only health and static assets
        env:
          WORKER_URL: ${{ steps.deploy.outputs.url }}
        run: |
          sleep 10
          curl -fsS "$WORKER_URL/api/health" | tee health.json
          grep -q '"liveTrading":false' health.json
          curl -fsS -o /dev/null "$WORKER_URL/"
