name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.detect.outputs.deploy }}
      strategy: ${{ steps.detect.outputs.strategy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.before }}
        run: |
          # A manually dispatched run is an explicit request to deploy and evaluate.
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "strategy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Pull requests are validated by CI and browser smoke; they never deploy
          # or run the production historical evaluation.
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "strategy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Treat a new branch/ref without a usable base as a full change.
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "strategy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")"
          echo "Changed files:"
          echo "$changed_files"

          # Rebuild/deploy only when application, runtime, relay, or dependency
          # files change. Documentation and CI-only edits must not redeploy prod.
          if grep -Eq '^(worker/|shared/|src/|public/|index[.]html$|wrangler[.]jsonc$|vite[.]config[.]ts$|tsconfig([.][a-z]+)?[.]json$|package[.]json$|package-lock[.]json$|supabase/functions/)' <<< "$changed_files"; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

          # Historical strategy evaluation is needed only when strategy/data
          # execution code, schema, or its evaluator changes.
          if grep -Eq '^(worker/|shared/|supabase/(functions|migrations)/|scripts/(backtest[.]ts|backtest-history[.]ts|backtest-execution[.]ts|paper-report[.]ts|write-evaluation-summary[.]mjs)$|package[.]json$|package-lock[.]json$)' <<< "$changed_files"; then
            echo "strategy=true" >> "$GITHUB_OUTPUT"
          else
            echo "strategy=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: indodax_quant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d indodax_quant_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Verify Supabase security and index migrations on PostgreSQL 17
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d indodax_quant_test -v ON_ERROR_STOP=1 -f tests/sql/is_app_user_security_setup.sql
          psql -h localhost -U postgres -d indodax_quant_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261114170008_is_app_user_security_invoker.sql
          psql -h localhost -U postgres -d indodax_quant_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261114170619_improve_paper_trade_fk_indexes.sql
          psql -h localhost -U postgres -d indodax_quant_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261114171017_optimize_app_users_self_rls_initplan.sql
          psql -h localhost -U postgres -d indodax_quant_test -v ON_ERROR_STOP=1 -f tests/sql/is_app_user_security_assert.sql
          psql -h localhost -U postgres -d indodax_quant_test -v ON_ERROR_STOP=1 -f tests/sql/mtf_source_precedence_test.sql
          psql -h localhost -U postgres -d indodax_quant_test -v ON_ERROR_STOP=1 -f tests/sql/run_watchdog_test.sql
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  deploy:
    needs: [test, detect-changes]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.detect-changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Deploy Supabase Edge Function (INDODAX read-only relay)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN not set - skipping indodax-proxy deploy (INDODAX blocks Cloudflare Workers, market data needs this relay)."
          else
            npx -y supabase@2 functions deploy indodax-proxy --project-ref znikuooxiqfcicyuhqsx --no-verify-jwt --use-api
            sleep 3
            curl -fsS "https://znikuooxiqfcicyuhqsx.supabase.co/functions/v1/indodax-proxy?path=%2Fapi%2Fticker%2Fbtcidr" | tee relay.json
            grep -q '"last"' relay.json
          fi
      - name: Check Cloudflare secrets
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set - skipping deploy. See README > Cloudflare deployment."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.skip != 'true'
        run: npm install --no-audit --no-fund && npm run build
      - name: Deploy Worker + static assets + cron trigger
        if: steps.check.outputs.skip != 'true'
        id: deploy
        run: |
          npx wrangler deploy 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "::notice title=Deployed URL::$URL"
      - name: Sync Worker secrets
        if: steps.check.outputs.skip != 'true'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
        run: |
          for NAME in SUPABASE_SERVICE_ROLE_KEY TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID POSTHOG_PROJECT_TOKEN; do
            VALUE="${!NAME}"
            if [ -n "$VALUE" ]; then
              printf '%s' "$VALUE" | npx wrangler secret put "$NAME" >/dev/null && echo "synced $NAME"
            else
              echo "::warning::$NAME not set in GitHub secrets"
            fi
          done
      - name: Smoke test
        if: steps.check.outputs.skip != 'true' && steps.deploy.outputs.url != ''
        run: |
          sleep 10
          curl -fsS "${{ steps.deploy.outputs.url }}/api/health" | tee health.json
          grep -q '"liveTrading":false' health.json
          curl -fsS -o /dev/null "${{ steps.deploy.outputs.url }}/"
          echo "Deployed: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"

  strategy-evaluation:
    needs: [test, detect-changes]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.detect-changes.outputs.strategy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: https://znikuooxiqfcicyuhqsx.supabase.co
      BACKTEST_HISTORY_DAYS: 30
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Verify the read-only evaluation credential is available
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY is required for historical evaluation."
            exit 1
          fi
      - name: Validate evaluation summary generator syntax
        run: node --check scripts/write-evaluation-summary.mjs
      - name: Run controlled crossLookback 2 vs 4 backtest
        run: |
          mkdir -p artifacts
          ./node_modules/.bin/tsx scripts/backtest.ts > artifacts/backtest.json 2> artifacts/backtest-stderr.log
      - name: Generate read-only paper account report
        run: ./node_modules/.bin/tsx scripts/paper-report.ts 1 > artifacts/paper-report.json
      - name: Write evaluation summary
        run: node scripts/write-evaluation-summary.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strategy-evaluation
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
