name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.detect.outputs.deploy }}
      relay: ${{ steps.detect.outputs.relay }}
      strategy: ${{ steps.detect.outputs.strategy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        name: Classify changed files for release
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/detect-ci-changes.mjs

  test:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: indodax_quant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d indodax_quant_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Generate reproducible lockfile with the CI npm toolchain
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile to the same-repository PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git ls-tree -r HEAD --name-only | grep -qx 'package-lock.json'; then
            echo "package-lock.json already exists in the branch."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "build: add npm lockfile generated by CI Node 24"
            AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            git -c http.extraheader="AUTHORIZATION: basic $AUTH" push origin "HEAD:$GITHUB_HEAD_REF"
          fi
      - name: Verify clean reproducible dependency installation
        run: npm ci --no-audit --no-fund
      - name: Verify Supabase security and index migrations on PostgreSQL 17
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d indodax_quant_test -v ON_ERROR_STOP=1 -f tests/sql/is_app_user_security_setup.sql
          psql -h localhost -U postgres -d indodax_quant_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261114170008_is_app_user_security_invoker.sql
          psql -h localhost -U postgres -d indodax_quant_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261114170619_improve_paper_trade_fk_indexes.sql
          psql -h localhost -U postgres -d indodax_quant_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261114171017_optimize_app_users_self_rls_initplan.sql
          psql -h localhost -U postgres -d indodax_quant_test -v ON_ERROR_STOP=1 -f tests/sql/is_app_user_security_assert.sql
          psql -h localhost -U postgres -d indodax_quant_test -v ON_ERROR_STOP=1 -f tests/sql/mtf_source_precedence_test.sql
          psql -h localhost -U postgres -d indodax_quant_test -v ON_ERROR_STOP=1 -f tests/sql/run_watchdog_test.sql
      - name: Replay the complete Supabase migration chain on a clean PostgreSQL 17 database
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h localhost -U postgres indodax_quant_migration_test
          psql -h localhost -U postgres -d indodax_quant_migration_test -v ON_ERROR_STOP=1 -f tests/sql/migrations-clean-bootstrap.sql
          for migration in supabase/migrations/*.sql; do
            echo "Applying $migration"
            psql -h localhost -U postgres -d indodax_quant_migration_test -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql -h localhost -U postgres -d indodax_quant_migration_test -v ON_ERROR_STOP=1 -f tests/sql/migrations-clean-assert.sql
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist-and-lock
          path: |
            dist/
            package-lock.json

  # Deploy the relay separately and verify both unsigned rejection and valid HMAC traffic.
  deploy-relay:
    needs: [test, detect-changes]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.detect-changes.outputs.relay == 'true'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: https://znikuooxiqfcicyuhqsx.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Require relay deployment credentials
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::SUPABASE_ACCESS_TOKEN is required when the relay changes."; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "::error::SUPABASE_SERVICE_ROLE_KEY is required for relay verification."; exit 1; }
      - name: Deploy authenticated INDODAX relay
        run: |
          npx -y supabase@2 functions deploy indodax-proxy --project-ref znikuooxiqfcicyuhqsx --no-verify-jwt --use-api
      - name: Verify unsigned requests are blocked and HMAC requests work
        run: npx tsx scripts/smoke-relay.ts

  # Worker deployment is blocked if a required relay update failed.
  deploy:
    needs: [test, detect-changes, deploy-relay]
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      needs.test.result == 'success' &&
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.deploy == 'true' &&
      (needs.deploy-relay.result == 'success' || needs.deploy-relay.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require production deployment credentials
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is required for a Worker deployment."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is required for a Worker deployment."; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "::error::SUPABASE_SERVICE_ROLE_KEY is required for a Worker deployment."; exit 1; }
      - run: npm install --no-audit --no-fund && npm run build
      - name: Deploy Worker + static assets + cron trigger
        id: deploy
        run: |
          npx wrangler deploy 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          test -n "$URL" || { echo "::error::Unable to identify deployed Worker URL."; exit 1; }
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "::notice title=Deployed URL::$URL"
      - name: Sync required and optional Worker secrets
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
        run: |
          printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY >/dev/null
          echo "synced SUPABASE_SERVICE_ROLE_KEY"
          for NAME in TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID POSTHOG_PROJECT_TOKEN; do
            VALUE="${!NAME}"
            if [ -n "$VALUE" ]; then
              printf '%s' "$VALUE" | npx wrangler secret put "$NAME" >/dev/null && echo "synced $NAME"
            else
              echo "::notice::$NAME is optional and not configured."
            fi
          done
      - name: Smoke test paper-only runtime, configuration, and cron
        env:
          WORKER_URL: ${{ steps.deploy.outputs.url }}
          SUPABASE_URL: https://znikuooxiqfcicyuhqsx.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          sleep 10
          curl -fsS "$WORKER_URL/api/health" | tee health.json
          grep -q '"liveTrading":false' health.json
          curl -fsS -o /dev/null "$WORKER_URL/"
          npx tsx scripts/smoke-production.ts

  strategy-evaluation:
    needs: [test, detect-changes]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.detect-changes.outputs.strategy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: https://znikuooxiqfcicyuhqsx.supabase.co
      BACKTEST_HISTORY_DAYS: 30
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Verify the read-only evaluation credential is available
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY is required for historical evaluation."
            exit 1
          fi
      - name: Validate evaluation summary generator syntax
        run: node --check scripts/write-evaluation-summary.mjs
      - name: Run controlled crossLookback 2 vs 4 backtest
        run: |
          mkdir -p artifacts
          ./node_modules/.bin/tsx scripts/backtest.ts > artifacts/backtest.json 2> artifacts/backtest-stderr.log
      - name: Generate read-only paper account report
        run: ./node_modules/.bin/tsx scripts/paper-report.ts 1 > artifacts/paper-report.json
      - name: Write evaluation summary
        run: node scripts/write-evaluation-summary.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strategy-evaluation
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
