name: One-off Supabase migration validation

on:
  push:
    branches:
      - fix/forensic-audit-remediation
    paths:
      - .github/workflows/oneoff-supabase-migration.yml

permissions:
  contents: read

jobs:
  validate-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Prepare isolated Supabase-like RLS and paper-trading fixture
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/sql/is_app_user_security_setup.sql
      - name: Apply app membership security migration locally
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261114170008_is_app_user_security_invoker.sql
      - name: Apply paper-trading FK indexes migration locally
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261114170619_improve_paper_trade_fk_indexes.sql
      - name: Apply app users RLS initplan migration locally
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261114171017_optimize_app_users_self_rls_initplan.sql
      - name: Assert helper security, nested RLS, FK indexes and policy initplan
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/sql/is_app_user_security_assert.sql
