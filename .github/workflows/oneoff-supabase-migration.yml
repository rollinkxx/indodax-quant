name: One-off Supabase migration filename

on:
  push:
    branches:
      - fix/forensic-audit-remediation
    paths:
      - .github/workflows/oneoff-supabase-migration.yml

permissions:
  contents: read

jobs:
  generate-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate migration filename with Supabase CLI
        run: npx --yes supabase@3.1.0 migration new is_app_user_security_invoker
      - name: Verify generated migration skeleton
        run: |
          FILE="$(find supabase/migrations -maxdepth 1 -type f -name '*_is_app_user_security_invoker.sql' -print -quit)"
          test -n "$FILE"
          test ! -s "$FILE"
          echo "MIGRATION_FILE=$FILE" >> "$GITHUB_ENV"
          echo "Generated $FILE"
      - uses: actions/upload-artifact@v4
        with:
          name: is-app-user-migration-skeleton
          path: ${{ env.MIGRATION_FILE }}
          if-no-files-found: error
